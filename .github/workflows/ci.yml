name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README
        shell: bash
        run: |
          test -s README.md
          grep -q "UNAPEC" README.md
          grep -q "ISO-300" README.md
          grep -q "Información académica" README.md
          grep -q "Stack tecnológico" README.md
          grep -q "Roadmap" README.md

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TestGraph.sln

      - name: Build
        run: dotnet build TestGraph.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TestGraph.sln --configuration Release --no-build


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/testgraph-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/testgraph-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
