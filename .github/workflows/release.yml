name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TestGraph.sln

      - name: Build backend
        run: dotnet build TestGraph.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test TestGraph.sln --configuration Release --no-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend
        working-directory: frontend/testgraph-web
        run: npm install

      - name: Lint frontend
        working-directory: frontend/testgraph-web
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/testgraph-web
        run: npm run build
